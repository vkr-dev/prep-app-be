services:
  - type: web
    name: prep-app-be
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pinned to match what's actually been tested locally (venv is 3.10.0),
      # not context.md's original 3.11 aspiration - safer than introducing
      # an untested runtime at deploy time.
      - key: PYTHON_VERSION
        value: 3.10.13

      # "1" = Anthropic, "2" = Google, "3" = Groq - see app/llm/client.py.
      # Only the active provider's key needs a real value for TEXT
      # GENERATION - but GOOGLE_API_KEY is required either way, since
      # RAG/dedup embeddings always use Google's API (see app/rag/embeddings.py).
      - key: LLM_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-3.6-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b

      - key: JWT_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false

      - key: DATABASE_URL
        sync: false

      # Set to the deployed frontend's exact Render URL once it exists -
      # see prep-app-ui's render.yaml. Not knowable until that's deployed.
      - key: CORS_ALLOW_ORIGINS
        sync: false
